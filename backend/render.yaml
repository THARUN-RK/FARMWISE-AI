services:
  - type: web
    name: farmwise-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmwise-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      - key: CORS_ORIGINS
        value: https://tharun-rk.github.io

      - key: DEMO_DATA
        value: "false"

databases:
  - name: farmwise-db
    plan: free